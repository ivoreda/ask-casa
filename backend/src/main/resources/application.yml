spring:
  application:
    name: casava-demo
  datasource:
    url: jdbc:h2:file:./data/casava-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  h2:
    console:
      enabled: true
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:openai/gpt-4o-mini}
      embedding:
        options:
          model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}

casava:
  ai:
    top-k: 5
    similarity-threshold: 0.55
    max-context-chars: 6000
    max-history-messages: 20
    # Comma-separated. On Railway set CASAVA_AI_FRONTEND_ORIGIN to the web service URL.
    frontend-origin: ${CASAVA_AI_FRONTEND_ORIGIN:http://localhost:5173}
    vector-store-path: ./data/vector-store.json
  knowledge:
    reindex-on-startup: true

server:
  port: ${PORT:8080}
